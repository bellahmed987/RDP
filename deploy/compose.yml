services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: resource_distribution_db
      MARIADB_USER: ${DB_USERNAME:-rdp}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mariadb://database:3306/resource_distribution_db
      DB_USERNAME: ${DB_USERNAME:-rdp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in deploy/.env}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      FCM_ENABLED: "false"
    volumes:
      - uploaded-files:/app/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  database-data:
  uploaded-files:
  caddy-data:
  caddy-config:
