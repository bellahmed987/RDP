spring:
  application:
    name: resource-distribution-platform
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/resource_distribution_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    demo-password: ${SEED_DEMO_PASSWORD:}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  firebase:
    enabled: ${FCM_ENABLED:false}
    credentials: ${FIREBASE_CREDENTIALS:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
